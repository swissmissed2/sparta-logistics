services:
  # PostgreSQL
  postgres:
    image: postgres:15
    container_name: sparta-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sparta-net

  # Redis (JWT Refresh Token + 허브/경로 캐싱)
  redis:
    image: redis:7.2
    container_name: sparta-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    networks:
      - sparta-net

  # Zookeeper (Kafka의 매니저 역할)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: sparta-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - sparta-net

  # Kafka 본체 (Zookeeper가 켜진 후 실행되도록 depends_on 추가)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sparta-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - sparta-net

  # Zipkin
  zipkin:
    image: openzipkin/zipkin:3
    container_name: sparta-zipkin
    ports:
      - "9411:9411"
    networks:
      - sparta-net

  # Config Server (가장 먼저 기동)
  config-server:
    build:
      context: ./config-server
    container_name: sparta-config-server
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    networks:
      - sparta-net

  # Discovery Server (Eureka)
  discovery-server:
    build:
      context: ./discovery-server
    container_name: sparta-discovery-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    networks:
      - sparta-net

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
    container_name: sparta-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - config-server
      - discovery-server
    networks:
      - sparta-net

  # User Service
  user-service:
    build:
      context: ./user-service
    container_name: sparta-user-service
    ports:
      - "19091:19091"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - redis
      - kafka
    networks:
      - sparta-net

  # Hub Service
  hub-service:
    build:
      context: ./hub-service
    container_name: sparta-hub-service
    ports:
      - "19092:19092"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - kafka
    networks:
      - sparta-net

  # Company Service
  company-service:
    build:
      context: ./company-service
    container_name: sparta-company-service
    ports:
      - "19093:19093"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - redis
      - kafka
    networks:
      - sparta-net

  # Product Service
  product-service:
    build:
      context: ./product-service
    container_name: sparta-product-service
    ports:
      - "19094:19094"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - kafka
    networks:
      - sparta-net

  # Order Service
  order-service:
    build:
      context: ./order-service
    container_name: sparta-order-service
    ports:
      - "19095:19095"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - redis
      - kafka
    networks:
      - sparta-net

  # Delivery Service
  delivery-service:
    build:
      context: ./delivery-service
    container_name: sparta-delivery-service
    ports:
      - "19096:19096"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - kafka
    networks:
      - sparta-net

  # Slack Service
  slack-service:
    build:
      context: ./slack-service
    container_name: sparta-slack-service
    ports:
      - "19097:19097"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - config-server
      - discovery-server
      - postgres
      - kafka
    networks:
      - sparta-net

volumes:
  postgres-data:
  redis-data:

networks:
  sparta-net:
    driver: bridge
